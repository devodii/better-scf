name: Release extension

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and zip
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      zip-name: ${{ steps.zip.outputs.name }}
    env:
      WXT_SERVER_URL: ${{ vars.WXT_SERVER_URL }}
    steps:
      - name: Require a release server URL
        run: |
          if [ -z "$WXT_SERVER_URL" ]; then
            echo "Repository variable WXT_SERVER_URL is not set; a release would point at localhost." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          # Full history so the tagged commit can be compared with origin/main.
          fetch-depth: 0
      - name: Require the tagged commit to be on main
        env:
          TAG: ${{ github.ref_name }}
          TAG_SHA: ${{ github.sha }}
        run: |
          if ! git merge-base --is-ancestor "$TAG_SHA" origin/main; then
            echo "Tag $TAG ($TAG_SHA) is not reachable from origin/main; releases are cut from main only." >&2
            exit 1
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter extension build
      - run: pnpm --filter extension zip
      - name: Name the zip after the root version
        id: zip
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v${version}" ]; then
            echo "Tag $TAG does not match package.json version ${version}." >&2
            exit 1
          fi
          zip_path="$(ls apps/extension/.output/*-chrome.zip | head -n 1)"
          test -n "$zip_path"
          cp "$zip_path" "better-scf-${version}.zip"
          echo "name=better-scf-${version}.zip" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zip.outputs.name }}
          path: ${{ steps.zip.outputs.name }}
          if-no-files-found: error
          retention-days: 14

  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.zip-name }}
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          ZIP_NAME: ${{ needs.build.outputs.zip-name }}
        run: gh release create "$TAG" "$ZIP_NAME" --title "$TAG" --generate-notes --verify-tag

  publish-chrome-web-store:
    name: Publish to Chrome Web Store
    needs: [build, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # A secret cannot be tested in `if:`; expose only whether all four exist.
      CWS_CONFIGURED: ${{ secrets.CWS_CLIENT_ID != '' && secrets.CWS_CLIENT_SECRET != '' && secrets.CWS_REFRESH_TOKEN != '' && secrets.CWS_EXTENSION_ID != '' }}
    steps:
      - name: Report whether publishing is configured
        run: |
          if [ "$CWS_CONFIGURED" != "true" ]; then
            echo "Skipped: the four CWS_* secrets are not all set, so nothing was published to the Chrome Web Store." >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: env.CWS_CONFIGURED == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.zip-name }}
      - if: env.CWS_CONFIGURED == 'true'
        name: Upload and publish
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          ZIP_NAME: ${{ needs.build.outputs.zip-name }}
        run: npx --yes chrome-webstore-upload-cli@3 upload --source "$ZIP_NAME" --auto-publish
