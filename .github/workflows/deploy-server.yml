name: Deploy server

on:
  push:
    branches: [main]
    paths:
      - "apps/server/**"
      - "packages/shared/**"
      - "railway.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter server build

  deploy:
    name: Deploy to Railway
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      RAILWAY_CONFIGURED: ${{ secrets.RAILWAY_TOKEN != '' }}
      SERVER_URL: ${{ vars.WXT_SERVER_URL }}
    steps:
      - name: Skip when Railway is not configured
        if: env.RAILWAY_CONFIGURED != 'true'
        run: |
          echo "Skipped: RAILWAY_TOKEN is not set, nothing was deployed." >> "$GITHUB_STEP_SUMMARY"
      - if: env.RAILWAY_CONFIGURED == 'true'
        uses: actions/checkout@v4
      - if: env.RAILWAY_CONFIGURED == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install Railway CLI
        if: env.RAILWAY_CONFIGURED == 'true'
        run: npm i -g @railway/cli@4
      - name: Deploy
        if: env.RAILWAY_CONFIGURED == 'true'
        # Must run from the repository root: the server Dockerfile needs the root as its build context.
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service better-scf-server --ci
      - name: Wait for /health
        if: env.RAILWAY_CONFIGURED == 'true'
        run: |
          if [ -z "$SERVER_URL" ]; then
            echo "Repository variable WXT_SERVER_URL is not set; cannot poll /health." >&2
            exit 1
          fi
          for _ in $(seq 1 24); do
            if curl --fail --silent --show-error "${SERVER_URL%/}/health"; then
              echo
              exit 0
            fi
            sleep 5
          done
          echo "No healthy /health response within 2 minutes." >&2
          exit 1
