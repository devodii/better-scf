# Deploy context: `railway up` runs from the REPOSITORY ROOT (the Dockerfile
# copies packages/shared and the lockfile), not from apps/server. In the Railway
# dashboard, set the service's config-as-code file path once to
# /apps/server/railway.toml.

[build]
builder = "DOCKERFILE"
# Relative to the repository root, which is the build context.
dockerfilePath = "apps/server/Dockerfile"

[deploy]
startCommand = "node dist/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
